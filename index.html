<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Brain</title>
<style>body{margin:0;background:#0a0a0f;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui;color:#888}.loader{text-align:center}.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#8b5cf6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="loader"><div class="spinner"></div><div>Loading Open Brain...</div></div>
<script>
fetch("https://ulyfanmimpduissivodl.supabase.co/storage/v1/object/public/ui/open-brain.html")
.then(function(r){return r.text()})
.then(function(html){document.open();document.write(html);document.close()})
.catch(function(e){document.body.innerHTML="<div style=\"color:#f87171;text-align:center;margin-top:40vh;font-family:system-ui\"><h2>Failed to load Open Brain</h2><p>"+e.message+"</p><p><a href=\"javascript:location.reload()\" style=\"color:#8b5cf6\">Retry</a></p></div>"});
</script>
</body>
</html>
